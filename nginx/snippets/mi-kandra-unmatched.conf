# Mi Kandra — journal des requêtes qui ne visent AUCUN site de ce projet.
# Fichier IDENTIQUE dans chaque projet (poma, mga, artest, influencor…). Inclus au niveau http,
# après mi-kandra-cloudflare.conf (qui définit $mk_client_ip).
#
# Le vhost par défaut de chaque projet (Host inconnu, accès direct par l'IP, domaine d'un projet
# voisin pas encore déployé, robots qui sondent tous les protocoles) journalise avec ce format.
# Le préfixe « mk-unmatched » sépare ce trafic de celui du projet : ./start.sh --logs le masque
# (un total s'affiche) et ne le montre qu'avec --scans, domaine demandé ($host) en tête.
#
# Derrière le routeur partagé (scripts/edge), ce trafic n'atteint jamais un projet : le routeur
# le refuse lui-même. Ce format ne sert donc qu'au projet qui tient seul les ports 80/443.
log_format mi_kandra_unmatched 'mk-unmatched $mk_client_ip - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';
