# =============================================================================
# Influencor — corps commun du vhost HTTPS (build web Flutter).
# Inclus par chaque nginx/sites/<domaine>.conf, après ssl_certificate*.
# =============================================================================
include /etc/nginx/snippets/ssl-params.conf;

server_tokens off;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
gzip_min_length 1024;

# Fichiers non versionnés par hash : toujours revalidés, sinon une nouvelle
# version du build resterait coincée dans le cache / le service worker.
location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ~* \.(?:js|wasm|css|png|jpg|jpeg|svg|ico|ttf|otf|woff2?|json|bin)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Routes de l'app (go_router) : retombent sur index.html.
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
