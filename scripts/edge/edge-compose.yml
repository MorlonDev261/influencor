# =============================================================================
# Mi Kandra Edge — routeur d'entrée partagé. Voir scripts/edge/mi-kandra-edge.sh.
#
# Ce fichier est IDENTIQUE dans chaque projet (poma, mga, artest…) : peu
# importe lequel démarre le routeur, le nom de projet Compose est fixe, donc
# l'opération est idempotente.
# =============================================================================
name: mi-kandra-edge

services:
  edge:
    image: nginx:1.27.5-alpine
    container_name: mi-kandra-edge
    restart: unless-stopped
    labels:
      org.mi-kandra.role: edge
      org.mi-kandra.edge.version: "1"
    # Pas de docker-entrypoint (pas d'envsubst) : la config est statique.
    entrypoint: ["nginx", "-g", "daemon off;"]
    # IPv4 uniquement : le réseau mi-kandra-edge n'a pas d'IPv6, donc une
    # publication sur [::] passe par docker-proxy, qui remplace l'IP du client
    # par la passerelle du réseau (envoyée telle quelle en PROXY protocol) et
    # contourne la chaîne DOCKER-USER. Cloudflare joint l'origine en IPv4.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./edge-nginx.conf:/etc/nginx/nginx.conf:ro
      - mi-kandra-edge-routes:/etc/mi-kandra-edge/routes.d
    networks:
      - mi-kandra-edge
    # Durcissement : racine en lecture seule, aucune capacité sauf bind <1024, chown
    # et le drop de privilèges des workers.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/__mi_kandra_edge_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Au démarrage, une sonde par seconde (au lieu d'attendre 15 s) : le routeur
      # est déclaré sain dès qu'il répond. Docker >= 25.
      start_period: 20s
      start_interval: 1s
    # nginx s'arrête par SIGQUIT (arrêt en douceur) et attendrait la fin des
    # connexions longues (proxy_timeout 1h, WebSocket) : Docker le tuait au bout
    # de 10 s, autant de secondes sans personne sur 80/443 lors d'un retour au
    # mode autonome ou d'une recréation du routeur.
    stop_grace_period: 2s

volumes:
  mi-kandra-edge-routes:
    name: mi-kandra-edge-routes

networks:
  mi-kandra-edge:
    name: mi-kandra-edge
