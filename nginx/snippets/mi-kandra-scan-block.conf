# Mi Kandra — robots qui cherchent des secrets ou des fichiers de configuration sur le VRAI
# domaine (passés par Cloudflare, donc pas filtrés par le vhost par défaut). Fichier IDENTIQUE
# dans chaque projet, inclus dans le server HTTPS de chaque site, APRÈS les destinations S3
# présignées : la première regex qui correspond l'emporte, un téléversement ne doit jamais
# tomber ici.
#
# Coupés en 444, sans journal : ils n'atteignent ni l'application (une page 404 rendue à chaque
# fois) ni ./start.sh --logs. Visés (relevés en production) :
#   • fichiers ou dossiers cachés (.env, .git, .npmrc, .claude/, .s3cfg…), sauf /.well-known
#     et .last_build_id (Flutter web) ;
#   • extensions de secrets, de sauvegardes ou de configuration serveur (.php, .env, .ini, .sql,
#     .bak, .yml, .toml, .pem, .key, .log…) ;
#   • fichiers de configuration nommés (secrets.json, config.js, appsettings*.json…) — le nom
#     seul reste libre : /settings ou /admin/credentials sont de vraies pages ;
#   • WordPress, phpinfo, _profiler, _environment, Dockerfile, vendor/.
# Vérifié contre tous les fichiers publics et toutes les routes des projets Mi Kandra.
location ~* "(^|/)\.(?!well-known/|last_build_id$)|\.(php[0-9]?|env|ini|sql|bak|old|swp|toml|ya?ml|pem|key|log)$|(^|/)(secrets?|credentials|appsettings[a-z.]*|settings|config|env|env-config|runtime-config|aws-exports|auth|app\.config|database|composer)\.(json|js|txt|xml|cfg)$|(^|/)(phpinfo|php-info|_profiler|_environment|dockerfile|vendor|wp-admin|wp-includes|wp-content|wp-json|wp-login\.php|xmlrpc\.php|wlwmanifest\.xml)(/|$)" {
    access_log off;
    return 444;
}
